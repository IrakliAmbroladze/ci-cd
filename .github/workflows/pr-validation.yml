name: PR Validation

on:
  pull_request:
    branches:
      - main

jobs:
  check-branch-name:
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch name
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          echo "Source branch: $BRANCH_NAME"
          if [[ ! "$BRANCH_NAME" =~ ^feature/ ]]; then
            echo "❌ Branch name '$BRANCH_NAME' does not start with 'feature/'"
            exit 1
          fi
          echo "✅ Branch name is valid"

  validate:
    runs-on: ubuntu-latest
    needs: check-branch-name
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build
